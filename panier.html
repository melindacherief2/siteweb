<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Votre Panier - GlowSkin</title>
  <style>
    /* Base */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fffaf8;
      margin: 0;
      padding: 40px 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #d77a61;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .btn-back {
      display: inline-block;
      margin-bottom: 20px;
      color: #d77a61;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .btn-back:hover {
      text-decoration: underline;
    }

    .cart-container {
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      text-align: left;
      padding: 15px;
      vertical-align: top;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: #fce8e6;
      font-weight: bold;
      color: #d77a61;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .product-image {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
    }

    .product-title {
      font-weight: bold;
      font-size: 16px;
    }

    .price {
      color: #d77a61;
      font-weight: bold;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-btn {
      background-color: #d77a61;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .qty-btn:hover {
      background-color: #b56550;
    }

    .qty-value {
      min-width: 20px;
      text-align: center;
      font-weight: bold;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: #e76f51;
      font-size: 18px;
      cursor: pointer;
    }

    .total-section {
      text-align: right;
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-top: 20px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .checkout-button,
    .clear-cart-button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .checkout-button {
      background-color: #2a9d8f;
      color: white;
    }

    .checkout-button:hover {
      background-color: #258f7f;
    }

    .clear-cart-button {
      background-color: #e76f51;
      color: white;
    }

    .clear-cart-button:hover {
      background-color: #d65c3d;
    }

    .empty-cart {
      text-align: center;
      font-style: italic;
      color: #d77a61;
      font-size: 18px;
      padding: 40px 0;
    }

    @media (max-width: 600px) {
      .product-title {
        font-size: 14px;
      }
      .qty-btn {
        padding: 4px 8px;
      }
      .total-section {
        font-size: 16px;
      }
    }

    /* Mode sombre */
    body.dark-mode {
      background-color: #121212;
      color: #f1f1f1;
    }

    .cart-container {
      background-color: #1e1e1e;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
    }

    th {
      background-color: #2c2c2c !important;
      color: #f1f1f1;
    }

    .product-title {
      color: #f1f1f1;
    }

    .price {
      color: #d77a61;
    }

    .remove-btn {
      color: #f4a261;
    }

    .total-section {
      color: #f1f1f1;
    }

    .btn-back {
      color: #d77a61;
    }

    /* Bouton mode sombre */
    .mode-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 24px;
      cursor: pointer;
      z-index: 1000;
    }
  </style>
</head>
<body>

<div class="mode-toggle" onclick="toggleDarkMode()" title="Basculer le mode">🌙</div>

<!-- Retour boutique -->
<a href="produit.html" class="btn-back">← Retour à la boutique</a>

<!-- Titre -->
<h1>Votre Panier</h1>

<!-- Conteneur panier -->
<div class="cart-container">
  <table id="cartTable">
    <thead>
      <tr>
        <th>Produit</th>
        <th>Prix</th>
        <th>Quantité</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="cartItems"></tbody>
  </table>

  <div class="total-section" id="cartTotal">
    Sous-total : 0€
  </div>

  <div class="actions">
    <button class="clear-cart-button" onclick="clearCart()">Vider le panier</button>
    <button class="checkout-button" onclick="checkout()">Passer commande</button>
  </div>
</div>

<script>
  // Récupérer le panier
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  function renderCart() {
    const tbody = document.getElementById('cartItems');
    tbody.innerHTML = '';

    if (!cart.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-cart">Votre panier est vide.</td></tr>';
      document.getElementById('cartTotal').textContent = '';
      return;
    }

    let totalGeneral = 0;

    cart.forEach(item => {
      const price = parseFloat(item.price.replace("€", ""));
      const subtotal = price * item.quantity;
      totalGeneral += subtotal;

      tbody.innerHTML += `
        <tr data-name="${item.name}">
          <td>
            <div class="product-info">
              <img src="${item.image}" alt="${item.name}" class="product-image">
              <span class="product-title">${item.name}</span>
            </div>
          </td>
          <td>${price.toFixed(2)} €</td>
          <td>
            <div class="quantity-controls">
              <button class="qty-btn" onclick="updateQuantity('${item.name}', -1)">−</button>
              <span class="qty-value">${item.quantity}</span>
              <button class="qty-btn" onclick="updateQuantity('${item.name}', 1)">+</button>
            </div>
          </td>
          <td>${subtotal.toFixed(2)} €</td>
          <td>
            <button class="remove-btn" onclick="removeFromCart('${item.name}')">×</button>
          </td>
        </tr>
      `;
    });

    document.getElementById('cartTotal').textContent = 'Sous-total : ' + totalGeneral.toFixed(2) + ' €';
  }

  function updateQuantity(name, delta) {
    const itemIndex = cart.findIndex(item => item.name === name);
    if (itemIndex > -1) {
      cart[itemIndex].quantity += delta;
      if (cart[itemIndex].quantity <= 0) {
        cart.splice(itemIndex, 1);
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }
  }

  function removeFromCart(name) {
    cart = cart.filter(item => item.name !== name);
    localStorage.removeItem('cart');
    renderCart();
  }

  function clearCart() {
    if (confirm("Souhaitez-vous vraiment vider votre panier ?")) {
      cart = [];
      localStorage.removeItem('cart');
      renderCart();
    }
  }

  function checkout() {
    alert("Fonctionnalité non implémentée.\nRediriger vers paiement.");
  }

  window.onload = () => {
    // Appliquer le mode sombre si sauvegardé
    const savedMode = localStorage.getItem('darkMode') === 'true';
    if (savedMode) {
      document.body.classList.add('dark-mode');
    }
    renderCart();
  };

  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('darkMode', isDark);
  }
</script>
</body>
</html>
